spring:
  application:
    name: default-spring-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

axelix:
  sbs:
    discovery:
      self-registration: false
      instance-name: default-spring-service
      instance-actuator-url: http://host.docker.internal:8080/actuator
      master-url: http://localhost:2935/api/internal/service/register
    transaction:
      monitoring:
        enabled: false



